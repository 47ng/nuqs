packages:
  - packages/**

catalogs:
  e2e:
    playwright: ^1.61.1
    '@playwright/test': ^1.61.1

  knip:
    knip: ^6.27.0

  msw:
    msw: ^2.15.0

  vitest:
    vitest: ^4.1.10
    '@vitest/browser-playwright': ^4.1.10
    '@vitest/coverage-v8': ^4.1.10

  vite:
    vite: ^8.1.5

  next:
    next: 16.3.0-preview.6

  react-router7:
    react-router: ^7.18.1
    '@react-router/dev': ^7.18.1
    '@react-router/express': ^7.18.1
    '@react-router/node': ^7.18.1
    '@react-router/serve': ^7.18.1

  react-router8:
    react-router: ^8.2.0
    '@react-router/dev': ^8.2.0
    '@react-router/express': ^8.2.0
    '@react-router/node': ^8.2.0
    '@react-router/serve': ^8.2.0

  react19:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7

  typescript:
    # JS API provider for tooling that imports `typescript` (tsdown, vitest,
    # knip, next). TS 7 drops the JS API until 7.1, so tooling stays on the
    # 6.0 bridge, which exposes its binary as `tsc6` to avoid clashing with 7.
    typescript: 'npm:@typescript/typescript6@^6.0.2'
    # Native Go compiler shipped as TypeScript 7. Exposes `tsc`, so the CLI
    # type-check scripts pick it up with no change.
    typescript-7: 'npm:typescript@^7.0.2'

enablePrePostScripts: false

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  playwright: true
  esbuild: true
  sharp: true
  msw: false
