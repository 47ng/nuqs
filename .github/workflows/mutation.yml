name: Mutation testing

on:
  push:
    branches:
      - next
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  mutation-pr:
    name: Mutation debt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for mutation-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            '.github/workflows/mutation.yml' \
            '.node-version' \
            'package.json' \
            'packages/nuqs/package.json' \
            'packages/nuqs/src' \
            'packages/nuqs/stryker.config.mjs' \
            'packages/nuqs/vitest.mutation.config.ts' \
            'packages/scripts/mutation-gate.ts' \
            'packages/scripts/mutation-gate.test.ts' \
            'pnpm-lock.yaml' \
            'pnpm-workspace.yaml' \
            'turbo.json'
          then
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check out the exact base commit
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout --detach "$BASE_SHA"
      - name: Check whether the base supports mutation testing
        if: steps.changes.outputs.relevant == 'true'
        id: baseline
        run: |
          if test -f packages/nuqs/stryker.config.mjs
          then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No base mutation report exists; this run establishes the initial baseline.'
          fi
      - name: Install baseline dependencies
        if: steps.baseline.outputs.supported == 'true'
        run: pnpm install --ignore-scripts --frozen-lockfile --filter nuqs...
      - name: Establish mutation baseline
        if: steps.baseline.outputs.supported == 'true'
        run: |
          for file in \
            .node-version \
            package.json \
            packages/nuqs/package.json \
            packages/nuqs/stryker.config.mjs \
            packages/nuqs/vitest.mutation.config.ts \
            packages/scripts/mutation-gate.ts \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json
          do
            printf '%s  %s\n' "$(git hash-object "$file")" "$file"
          done > "$RUNNER_TEMP/mutation-inputs-baseline.sha256"
          pnpm mutation -- --force
          cp packages/nuqs/reports/stryker-incremental.json \
            "$RUNNER_TEMP/mutation-baseline.json"
      - name: Check out the exact candidate commit
        if: steps.changes.outputs.relevant == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$HEAD_SHA"
      - name: Clear the baseline HTML report
        if: steps.changes.outputs.relevant == 'true'
        run: rm -rf packages/nuqs/reports/mutation/html
      - name: Verify comparable mutation inputs
        if: steps.baseline.outputs.supported == 'true'
        run: |
          for file in \
            .node-version \
            package.json \
            packages/nuqs/package.json \
            packages/nuqs/stryker.config.mjs \
            packages/nuqs/vitest.mutation.config.ts \
            packages/scripts/mutation-gate.ts \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json
          do
            printf '%s  %s\n' "$(git hash-object "$file")" "$file"
          done > "$RUNNER_TEMP/mutation-inputs-candidate.sha256"
          if ! diff -u \
            "$RUNNER_TEMP/mutation-inputs-baseline.sha256" \
            "$RUNNER_TEMP/mutation-inputs-candidate.sha256"
          then
            echo '::error::Mutation execution inputs changed; establish and review a new baseline explicitly.'
            exit 1
          fi
      - name: Install candidate dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --ignore-scripts --frozen-lockfile --filter nuqs...
      - name: Run incremental candidate mutation tests
        if: steps.changes.outputs.relevant == 'true'
        run: |
          mkdir -p packages/nuqs/reports
          if test '${{ steps.baseline.outputs.supported }}' = 'true'
          then
            cp "$RUNNER_TEMP/mutation-baseline.json" \
              packages/nuqs/reports/stryker-incremental.json
            pnpm mutation
          else
            pnpm mutation -- --force
          fi
          cp packages/nuqs/reports/stryker-incremental.json \
            "$RUNNER_TEMP/mutation-candidate.json"
      - name: Enforce the mutation-debt ratchet
        if: steps.baseline.outputs.supported == 'true'
        run: >-
          node packages/scripts/mutation-gate.ts
          "$RUNNER_TEMP/mutation-baseline.json"
          "$RUNNER_TEMP/mutation-candidate.json"
      - name: Upload candidate mutation report
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report-${{ github.event.pull_request.number }}
          path: packages/nuqs/reports/mutation/html/
          if-no-files-found: ignore
          retention-days: 14

  mutation-full:
    name: Mutation suite (full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile --filter nuqs...
      - name: Run the complete mutation suite
        run: pnpm mutation -- --force
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report-${{ github.run_id }}
          path: packages/nuqs/reports/mutation/html/
          if-no-files-found: ignore
          retention-days: 14
